name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Build + API suite + browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check backend sources
        run: |
          for f in $(git ls-files 'backend/src/**/*.js'); do
            node --check "$f"
          done

      - name: Build frontend
        run: npm run build

      - name: Backend API + real-time suite
        run: npm run test:api

      - name: Browser end-to-end suite
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-server-log
          path: /tmp/chatbot-test-server.log
          if-no-files-found: ignore
